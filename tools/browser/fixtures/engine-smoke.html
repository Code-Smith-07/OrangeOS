<!doctype html>
<meta charset="utf-8">
<title>OrangeOS upstream reference engine smoke</title>
<style>
  #layout { display: flex; width: 240px; height: 40px; }
  #layout > div { flex: 1; }
</style>
<div id="layout"><div></div><div></div></div>
<canvas id="canvas" width="2" height="2"></canvas>
<pre id="result">RUNNING: reference engine test</pre>
<script>
"use strict";
if (window.testRunner) {
  testRunner.dumpAsText();
  testRunner.waitUntilDone();
}
(async () => {
  const checks = [];
  const check = (name, passed) => {
    if (!passed) throw new Error(name);
    checks.push("PASS " + name);
  };
  try {
    check("javascript", [1, 2, 3].map(x => x * x).reduce((a, b) => a + b) === 14);
    const node = document.createElement("span");
    node.dataset.probe = "native-engine";
    document.body.append(node);
    check("dom", document.querySelector('[data-probe="native-engine"]') === node);
    check("css-layout", document.querySelector("#layout > div").getBoundingClientRect().width === 120);
    const context = document.querySelector("#canvas").getContext("2d");
    context.fillStyle = "#123456";
    context.fillRect(0, 0, 2, 2);
    const pixel = context.getImageData(0, 0, 1, 1).data;
    check("canvas", pixel[0] === 18 && pixel[1] === 52 && pixel[2] === 86 && pixel[3] === 255);
    check("async", await new Promise(resolve => setTimeout(() => resolve(42), 0)) === 42);
    document.querySelector("#result").textContent = checks.join("\n") + "\nORANGE_REFERENCE_ENGINE_PASS\n";
  } catch (error) {
    document.querySelector("#result").textContent = "ORANGE_REFERENCE_ENGINE_FAIL " + error.message;
  } finally {
    if (window.testRunner) testRunner.notifyDone();
  }
})();
</script>
