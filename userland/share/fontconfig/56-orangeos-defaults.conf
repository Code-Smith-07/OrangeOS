<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- OrangeOS's default fonts (B10): the generic families and the names
     toolkits ask for, mapped to the two fonts OrangeOS ships in /share/fonts.
     Inter stands in for serif until a serif font is added. -->
<fontconfig>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>JetBrains Mono</family></prefer>
  </alias>
  <alias binding="strong"><family>Sans</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="strong"><family>Monospace</family><prefer><family>JetBrains Mono</family></prefer></alias>
  <alias binding="strong"><family>Adwaita Sans</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="strong"><family>Cantarell</family><prefer><family>Inter</family></prefer></alias>
</fontconfig>
