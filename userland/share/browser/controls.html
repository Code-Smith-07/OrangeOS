<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Form controls</title>
<style>body { margin: 24px; font: 18px "Inter", sans-serif; } div { margin: 10px 0; }</style></head>
<body>
<div>Default input: <input value="default font"></div>
<div>Inter input: <input style="font: 18px Inter" value="Inter font"></div>
<div>Button: <button>Press me</button> <button style="font: 18px Inter">Inter button</button></div>
<div>Checkbox: <input type="checkbox" checked> Radio: <input type="radio" checked></div>
<div>Select: <select><option>First</option><option>Second</option></select></div>
<div>Textarea: <textarea rows="2">two lines
of text</textarea></div>
</body>
</html>
